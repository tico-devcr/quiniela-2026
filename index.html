<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela Familiar · Mundial 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1b6e3f;--gm:#228b4e;--gl:#e6f4ec;--gd:#0e3d22;--gold:#c8922a;--goldl:#fdf3e0;--red:#c0392b;--redl:#fce8e6;--blue:#1a6fa8;--bluel:#e6f0f8;--bg:#f2f0eb;--card:#fff;--border:#dedad2;--text:#1a1a18;--muted:#6b6860;--sw:230px;--r:13px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;letter-spacing:.3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s;white-space:nowrap;font-family:'Nunito',sans-serif}
.btn:active{transform:scale(.97)}
.bfull{width:100%;margin-bottom:8px}
.bprimary{background:var(--g);color:#fff}.bsecondary{background:var(--card);color:var(--g);border:2px solid var(--g)}
.bgold{background:var(--gold);color:#fff}.bred{background:var(--red);color:#fff}
.bghost{background:transparent;color:var(--muted);border:1.5px solid var(--border)}
.bsm{padding:7px 13px;font-size:13px}
.biconbtn{background:none;border:none;cursor:pointer;padding:6px;border-radius:6px;display:flex;align-items:center;color:rgba(255,255,255,.65)}
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.field input,.field select{width:100%;padding:12px 13px;border:2px solid var(--border);border-radius:var(--rs);font-size:15px;background:var(--bg);color:var(--text);-webkit-appearance:none;font-family:'Nunito',sans-serif}
.field input:focus,.field select:focus{outline:none;border-color:var(--g)}
.scorebox{width:46px;height:46px;border:2px solid var(--border);border-radius:var(--rs);font-size:24px;font-weight:800;text-align:center;background:var(--bg);color:var(--text);-webkit-appearance:none;font-family:'Barlow Condensed',sans-serif}
.scorebox:focus{outline:none;border-color:var(--g);background:#fff}
.scorebox:disabled{opacity:.45;cursor:not-allowed;background:var(--border)}
.scorebox::-webkit-inner-spin-button,.scorebox::-webkit-outer-spin-button{-webkit-appearance:none}
.resbox{width:50px;height:50px;border:2px solid var(--border);border-radius:var(--rs);font-size:22px;font-weight:800;text-align:center;background:var(--bg);color:var(--text);-webkit-appearance:none;font-family:'Barlow Condensed',sans-serif}
.resbox:focus{outline:none;border-color:var(--gold)}
.resbox::-webkit-inner-spin-button,.resbox::-webkit-outer-spin-button{-webkit-appearance:none}
.alert{padding:10px 13px;border-radius:var(--rs);font-size:14px;margin-bottom:13px}
.aerror{background:var(--redl);color:#8b1a11}.asuccess{background:var(--gl);color:var(--gd)}
.awarning{background:var(--goldl);color:#7a5510}.ainfo{background:var(--bluel);color:#0f4a72}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--gd)}
.auth-box{width:100%;max-width:400px}
.auth-logo{text-align:center;margin-bottom:26px}
.auth-logo .ball{font-size:52px;display:block;margin-bottom:6px}
.auth-logo h1{font-size:50px;font-weight:800;color:#fff;line-height:1;letter-spacing:2px}
.auth-logo h1 span{color:#f5d67a}
.auth-logo p{color:rgba(255,255,255,.55);font-size:13px;margin-top:4px;letter-spacing:1px;text-transform:uppercase}
.auth-card{background:#fff;border-radius:var(--r);padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.auth-card h2{font-size:24px;font-weight:700;color:var(--gd);margin-bottom:18px}
.auth-switch{text-align:center;font-size:14px;color:var(--muted);margin-top:14px}
.auth-switch a{color:var(--g);font-weight:700;cursor:pointer}
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sw);background:var(--gd);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;overflow-y:auto}
.sb-logo{padding:18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo .icon{font-size:26px}
.sb-logo .title{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;color:#f5d67a;letter-spacing:1px;line-height:1}
.sb-logo .sub{font-size:11px;color:rgba(255,255,255,.45)}
.sb-nav{padding:12px 8px;flex:1;display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:10px;padding:10px 13px;background:none;border:none;color:rgba(255,255,255,.55);border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;text-align:left;width:100%;font-family:'Nunito',sans-serif;transition:background .15s,color .15s}
.ni svg{width:17px;height:17px;flex-shrink:0}
.ni:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
.ni.active{background:rgba(255,255,255,.15);color:#fff}
.ni.active svg{stroke:#f5d67a}
.sb-user{padding:13px 14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:9px}
.ava{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;flex-shrink:0}
.uname{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urole{font-size:11px;color:rgba(255,255,255,.45)}
#main{flex:1;margin-left:var(--sw)}
.page{display:none;padding:24px 26px 36px;max-width:840px}
.page.active{display:block}
.pheader{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--border)}
.ptitle{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:var(--gd);letter-spacing:.5px}
.mpill{display:none}
#bnav{display:none}
@media(max-width:768px){
  #sidebar{display:none}
  #main{margin-left:0}
  .page{padding:14px 13px 130px;max-width:100%}
  .pheader{margin-bottom:14px;padding-bottom:10px}
  .ptitle{font-size:24px}
  .mpill{display:flex;align-items:center;gap:7px}
  #bnav{display:flex;flex-wrap:wrap;position:fixed;bottom:0;left:0;right:0;background:var(--gd);border-top:1px solid rgba(255,255,255,.08);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
  .bni{flex:0 0 20%;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 1px 8px;background:none;border:none;color:rgba(255,255,255,.5);font-size:9px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif}
  .bni svg{width:18px;height:18px}
  .bni.active{color:#f5d67a}
  .bni-admin{display:none}
}
.sbanner{border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:18px}
.sbanner.sgreen{background:var(--g);color:#fff}.sbanner.sgold{background:var(--gold);color:#fff}
.sbanner.sred{background:var(--red);color:#fff}.sbanner.sblue{background:var(--blue);color:#fff}
.sbanner .sicon{font-size:30px;flex-shrink:0}
.sbanner h3{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700}
.sbanner p{font-size:13px;opacity:.85;margin-top:2px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.aciertos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.statcard{background:var(--card);border-radius:var(--r);padding:14px 12px;border:1px solid var(--border);text-align:center}
.statcard.clickable{cursor:pointer}.statcard.clickable:hover{border-color:var(--g)}
.statval{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:800;line-height:1}
.statval-name{font-size:20px;line-height:1.15;word-break:break-word}
.statlbl{font-size:11px;color:var(--muted);margin-top:3px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.scgreen .statval{color:var(--g)}.scgold .statval{color:var(--gold)}.scblue .statval{color:var(--blue)}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--border)}.cp{padding:18px}
.mt8{margin-top:8px}.mt14{margin-top:14px}
.slabel{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.pcard{background:var(--card);border-radius:var(--r);padding:13px 15px;display:flex;align-items:center;gap:12px;margin-bottom:9px;border:1px solid var(--border)}
.pava{width:42px;height:42px;border-radius:50%;background:var(--gl);color:var(--gd);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;flex-shrink:0}
.pinfo{flex:1}.pname{font-weight:700;font-size:15px}.pstatus{font-size:12px;color:var(--muted);margin-top:2px}
.pbar{height:4px;background:var(--border);border-radius:2px;margin-top:6px}
.pbfill{height:100%;background:var(--g);border-radius:2px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.bgreen{background:var(--gl);color:var(--gd)}.bgray{background:#f0ede6;color:var(--muted)}
.plabel{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:16px 0 5px;border-bottom:1px solid var(--border);margin-bottom:12px}
.grp-block{background:var(--card);border-radius:var(--r);border:1px solid var(--border);margin-bottom:10px;overflow:hidden}
.grp-header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--card);border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;color:var(--gd);letter-spacing:.5px;text-align:left}
.grp-header:hover{background:#fafaf8}
.grp-arrow{font-size:12px;color:var(--muted)}
.grp-body{padding:10px 12px;border-top:1px solid var(--border);background:#fafaf8}
.grp-body .mcard{margin-bottom:9px}
.grp-body .mcard:last-child{margin-bottom:0}
.mcard{background:var(--card);border-radius:var(--r);border:1px solid var(--border);margin-bottom:8px;overflow:hidden}
.mcard-head{display:flex;justify-content:space-between;align-items:center;padding:7px 13px 0}
.mphase{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.mdate{font-size:11px;color:var(--muted)}
.mcard-body{padding:8px 13px 10px}
.mteams{display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;gap:6px;margin-bottom:8px}
.tname{font-weight:700;font-size:13px;line-height:1.2}
.tname.home{text-align:right}.tname.away{text-align:left}
.mcenter{display:flex;flex-direction:column;align-items:center;gap:2px}
.vstext{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px}
.scoreinputs{display:flex;align-items:center;justify-content:center;gap:7px}
.scoresep{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--muted)}
.resinputs{display:flex;align-items:center;gap:7px}
.ressep{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--muted)}
.mcard-foot{border-top:1px solid var(--border);padding:5px 13px;display:flex;align-items:center;justify-content:space-between;background:#fafaf8;gap:8px;flex-wrap:wrap}
.savedtag{font-size:12px;color:var(--g);font-weight:700}
.unsavedtag{font-size:12px;color:var(--muted)}
.lockedtag{font-size:12px;color:var(--red);font-weight:700}
.realthing{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--muted)}
.ptsbubble{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800}
.p4{background:var(--g);color:#fff}.p3{background:var(--blue);color:#fff}
.p2{background:var(--gold);color:#fff}.p1{background:#f0ede6;color:var(--muted)}.p0{background:var(--redl);color:var(--red)}
.score-display{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:800;color:var(--gd);letter-spacing:3px;padding:2px 0}
.lb-played{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:13px;padding:8px 13px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs)}
.lb-played-icon{font-size:15px}
.lbtable{display:flex;flex-direction:column;gap:7px}
.lbrow{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:13px 15px;display:flex;align-items:center;gap:11px}
.lbrow.isme{border:2px solid var(--g)}.lbrow.r1{border-color:#c8922a;background:linear-gradient(135deg,#fff 0%,var(--goldl) 100%)}
.lbrow.r2{border-color:#9e9e9e}.lbrow.r3{border-color:#a0714a}
.lbrank{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;min-width:32px;text-align:center;color:var(--muted)}
.lbrank.rk1{color:var(--gold);font-size:26px}.lbrank.rk2{color:#888;font-size:24px}.lbrank.rk3{color:#a0714a;font-size:24px}
.lbava{width:36px;height:36px;border-radius:50%;background:var(--gl);color:var(--gd);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;flex-shrink:0}
.lbinfo{flex:1;min-width:0}.lbname{font-weight:700;font-size:15px}.lbdetail{font-size:12px;color:var(--muted);margin-top:2px}
.lbpts{text-align:right}.lbptsval{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:var(--gd);line-height:1}
.lbptslbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.upblock{background:var(--card);border-radius:var(--r);border:1px solid var(--border);margin-bottom:14px;overflow:hidden}
.uphead{padding:11px 15px;background:var(--gl);display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border)}
.uphead .uname2{font-weight:700;font-size:14px;color:var(--gd)}
.uptotal{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--g);margin-left:auto}
.pickrow{padding:8px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:13px}
.pickrow:last-child{border-bottom:none}
.pickmatch{color:var(--muted);flex:1}
.pickscore{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700}
.wtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.wtab{padding:6px 13px;border-radius:20px;border:2px solid var(--border);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);font-family:'Nunito',sans-serif}
.wtab.active{background:var(--g);border-color:var(--g);color:#fff}
.adblock{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:18px;margin-bottom:14px}
.adblock h3{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;color:var(--gd);margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--border)}
.admrow{padding:11px 0;border-bottom:1px solid var(--border)}.admrow:last-child{border-bottom:none}
.admlabel{font-size:13px;font-weight:700;margin-bottom:7px;display:flex;justify-content:space-between}
.confirmed{font-size:13px;color:var(--muted);margin-top:5px}
.confirmed strong{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--gold)}
.new-match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.new-match-grid .field{margin:0}
@media(max-width:480px){.new-match-grid{grid-template-columns:1fr}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:#fff;border-radius:var(--r);padding:24px 22px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:slideUp .2s}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-icon{font-size:40px;text-align:center;margin-bottom:8px}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:var(--gd);text-align:center;margin-bottom:6px}
.modal-score{font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:800;color:var(--g);text-align:center;margin:8px 0;letter-spacing:3px}
.modal-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:4px}
.modal-body{font-size:14px;color:var(--muted);text-align:center;margin-bottom:4px}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns .btn{flex:1}
.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--gd);color:#fff;padding:9px 18px;border-radius:22px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:769px){.toast{bottom:22px}}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}.empty .ei{font-size:50px;margin-bottom:10px}
.flex-row{display:flex;gap:8px;flex-wrap:wrap}
.rule-card{border-radius:var(--rs);padding:14px;display:flex;align-items:flex-start;gap:14px;margin-bottom:10px}
.rule-pts{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;min-width:36px;text-align:center;line-height:1}
.rule-info .rule-title{font-weight:700;font-size:15px;margin-bottom:4px}
.rule-info .rule-desc{font-size:13px;line-height:1.5}

.cal-today{background:linear-gradient(135deg,var(--g) 0%,var(--gm) 100%);border-radius:var(--r);padding:16px;margin-bottom:8px;box-shadow:0 4px 14px rgba(27,110,63,.25)}
.cal-today-label{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:#fff;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.cal-nogames{background:var(--card);border:1px dashed var(--border);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);font-size:14px;margin-bottom:8px}
.cal-day{margin-bottom:18px}
.cal-date{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--gd);text-transform:capitalize;padding:8px 0 9px;border-bottom:2px solid var(--border);margin-bottom:10px;letter-spacing:.3px}
.cal-date.cal-past{color:var(--muted);opacity:.65}
.cal-day-today .cal-date{color:var(--g)}
.cal-hoy{display:inline-block;background:var(--g);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;letter-spacing:1px;vertical-align:middle;margin-left:6px}
.cal-match{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:10px 14px;margin-bottom:7px}
.cal-match-big{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);margin-bottom:8px}
.cal-match-big .cal-teams{color:#fff}
.cal-match-big .cal-vs{color:rgba(255,255,255,.6)}
.cal-match-big .cal-grp{color:rgba(255,255,255,.7)}
.cal-match-big .cal-time{color:#fff;background:rgba(255,255,255,.2)}
.cal-match-big .cal-score{color:#fff}
.cal-match-info{flex:1;min-width:0}
.cal-teams{font-size:14px;font-weight:700;color:var(--text);line-height:1.3}
.cal-vs{font-size:11px;color:var(--muted);font-weight:700;margin:0 3px}
.cal-grp{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}
.cal-match-right{flex-shrink:0;text-align:right}
.cal-time{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--g);background:var(--gl);padding:4px 11px;border-radius:14px;white-space:nowrap}
.cal-score{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:var(--gd);letter-spacing:1px}

.all-user{background:var(--card);border-radius:var(--r);border:1px solid var(--border);margin-bottom:9px;overflow:hidden}
.all-user-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--card);border:none;cursor:pointer;text-align:left}
.all-user-head:hover{background:#fafaf8}

function liveMatchCard(m,uids){
  var res=RESULTS[m.id];
  var hasRes=res!==undefined&&res!==null;
  // Collect predictions
  var preds=[];
  uids.forEach(function(uid){
    var p=(PREDS[uid]||{})[m.id];
    if(p)preds.push({name:dn(USERS[uid].name),home:p.home,away:p.away,pv:hasRes?pts(p,res):null});
  });

  var head="<div class='live-match-head'><div class='live-match-teams'><span class='lt-home'>"+m.h+"</span> <span class='live-vs'>vs</span> <span class='lt-away'>"+m.a+"</span></div>";
  if(hasRes)head+="<div class='live-match-score'>"+res.home+" - "+res.away+"</div>";
  else head+="<div class='live-match-time'>"+(m.t||"")+"</div>";
  head+="</div>";

  var body="";
  if(preds.length===0){
    body="<div class='live-nopicks'>Nadie pronostico este partido</div>";
  } else if(!hasRes){
    // No result yet: group identical scores, order by local-win -> draw -> away-win
    var scoreMap={};
    preds.forEach(function(pr){var k=pr.home+"-"+pr.away;if(!scoreMap[k])scoreMap[k]={home:pr.home,away:pr.away,names:[]};scoreMap[k].names.push(pr.name);});
    var keys=Object.keys(scoreMap);
    // outcome: 0=local win, 1=draw, 2=away win
    function outcome(o){if(o.home>o.away)return 0;if(o.home===o.away)return 1;return 2;}
    keys.sort(function(a,b){
      var oa=outcome(scoreMap[a]),ob=outcome(scoreMap[b]);
      if(oa!==ob)return oa-ob;
      // within same outcome, more people first
      return scoreMap[b].names.length-scoreMap[a].names.length;
    });
    body="<div class='live-pred-list'>";
    keys.forEach(function(k){
      var o=scoreMap[k];
      var oc=outcome(o);
      var scls=oc===0?"sc-home":(oc===1?"sc-draw":"sc-away");
      var chips=o.names.map(function(nm){return "<span class='live-chip'>"+nm+"</span>";}).join("");
      body+="<div class='live-pred-row'><span class='live-pred-score "+scls+"'>"+o.home+" - "+o.away+"</span><span class='live-pred-names'>"+chips+"</span></div>";
    });
    body+="</div>";
  } else {
    // Result exists: show who hit, sorted by points desc
    preds.sort(function(a,b){return (b.pv||0)-(a.pv||0);});
    body="<div class='live-pred-list'>";
    preds.forEach(function(pr){
      var badge=pvBadge(pr.pv);
      body+="<div class='live-result-row'><span class='live-result-name'>"+pr.name+"</span><span class='live-result-pick'>"+pr.home+"-"+pr.away+"</span>"+badge+"</div>";
    });
    body+="</div>";
  }

  return "<div class='live-match'>"+head+body+"</div>";
}

  return "<span class='live-badge "+x.c+"'>"+x.t+" <strong>"+pv+"</strong></span>";

  var h="";

  // For each pair, count identical exact scores

          if(x&&y){common++;if(+x.home===+y.home&&+x.away===+y.away)same++;}
        });
        if(common>0){
          var ratio=same/common;
          if(!bestPair||ratio>bestPair.ratio)bestPair={a:ua,b:ub,same:same,common:common,ratio:ratio};
          if(!worstPair||ratio<worstPair.ratio)worstPair={a:ua,b:ub,same:same,common:common,ratio:ratio};
        }
      }

  }

  h+="<div class='cur-card'><div class='cur-head'><span class='cur-emoji'>&#x1F3C5;</span><span class='cur-title'>De momento</span></div>";
  h+="<div class='cur-dm-sel'><select id='dmCat' onchange='runDeMomento()'>";
  h+="<option value='exact'>Mas marcadores exactos</option>";
  h+="<option value='diff'>Mas aciertos de diferencia</option>";
  h+="<option value='winner'>Mas aciertos de resultado</option>";
  h+="<option value='one'>Mas aciertos de goles de un equipo</option>";
  h+="</select></div>";
  h+="<div id='dmResult'></div></div>";

  // ---- 2. EL MAS ORIGINAL ----
  // For each match, find the majority exact score; count how many times each user differs from it
  var rebelCount={};uids.forEach(function(u){rebelCount[u]=0;});
  var rebelEligible=0;
  am.forEach(function(m){
    var tally={};
    uids.forEach(function(u){var p=(PREDS[u]||{})[m.id];if(p){var k=p.home+"-"+p.away;tally[k]=(tally[k]||0)+1;}});
    var keys=Object.keys(tally);
    if(keys.length===0)return;
    rebelEligible++;
    // majority score
    var maj=keys.sort(function(a,b){return tally[b]-tally[a];})[0];
    uids.forEach(function(u){var p=(PREDS[u]||{})[m.id];if(p){var k=p.home+"-"+p.away;if(k!==maj)rebelCount[u]++;}});
  });
  var rebel=null;
  uids.forEach(function(u){if(rebel===null||rebelCount[u]>rebelCount[rebel])rebel=u;});
  h+="<div class='cur-card'><div class='cur-head'><span class='cur-emoji'>&#x1F608;</span><span class='cur-title'>El mas original</span></div>";
  if(rebel!==null&&rebelEligible>0){
    h+="<div class='cur-big'>"+dn(USERS[rebel].name)+"</div><div class='cur-big-sub'>Eligio distinto a la mayoria "+rebelCount[rebel]+" veces</div>";
  } else h+="<div class='cur-empty'>Sin datos aun.</div>";
  h+="</div>";

  // ---- EL MAS POPULAR (antonimo: menos veces distinto a la mayoria) ----
  var popular=null;
  uids.forEach(function(u){if(popular===null||rebelCount[u]<rebelCount[popular])popular=u;});
  var coincided=(popular!==null)?(rebelEligible-rebelCount[popular]):0;
  h+="<div class='cur-card'><div class='cur-head'><span class='cur-emoji'>&#x1F465;</span><span class='cur-title'>El mas popular</span></div>";
  if(popular!==null&&rebelEligible>0){
    h+="<div class='cur-big'>"+dn(USERS[popular].name)+"</div><div class='cur-big-sub'>Coincidio con la mayoria "+coincided+" de "+rebelEligible+" veces</div>";
  } else h+="<div class='cur-empty'>Sin datos aun.</div>";
  h+="</div>";

  // ---- 3. EL REY DEL EMPATE ----
  var drawCount={};uids.forEach(function(u){drawCount[u]=0;});
  uids.forEach(function(u){
    var p=PREDS[u]||{};
    am.forEach(function(m){var x=p[m.id];if(x&&+x.home===+x.away)drawCount[u]++;});
  });
  var king=null;
  uids.forEach(function(u){if(king===null||drawCount[u]>drawCount[king])king=u;});
  h+="<div class='cur-card'><div class='cur-head'><span class='cur-emoji'>&#x1F91D;</span><span class='cur-title'>El rey del empate</span></div>";
  if(king!==null&&drawCount[king]>0){
    h+="<div class='cur-big'>"+dn(USERS[king].name)+"</div><div class='cur-big-sub'>Pronostico "+drawCount[king]+" empates</div>";
  } else h+="<div class='cur-empty'>Nadie ha pronosticado empates.</div>";
  h+="</div>";

  // ---- 4. OPTIMISTA y PESIMISTA (goles totales promedio) ----
  var golAvg={};
  uids.forEach(function(u){
    var p=PREDS[u]||{},tot=0,n=0;
    am.forEach(function(m){var x=p[m.id];if(x){tot+=(+x.home)+(+x.away);n++;}});
    if(n>0)golAvg[u]={avg:tot/n,n:n};
  });
  var optU=null,pesU=null;
  Object.keys(golAvg).forEach(function(u){
    if(optU===null||golAvg[u].avg>golAvg[optU].avg)optU=u;
    if(pesU===null||golAvg[u].avg<golAvg[pesU].avg)pesU=u;
  });
  h+="<div class='cur-card'><div class='cur-head'><span class='cur-emoji'>&#x26BD;</span><span class='cur-title'>Optimista y pesimista</span></div>";
  if(optU!==null){
    h+="<div class='cur-row'><div class='cur-row-label'>&#x1F525; El optimista</div><div class='cur-row-main'>"+dn(USERS[optU].name)+"</div><div class='cur-row-sub'>"+golAvg[optU].avg.toFixed(1)+" goles por partido en promedio</div></div>";
    h+="<div class='cur-row'><div class='cur-row-label cur-label-blue'>&#x1F9CA; El pesimista</div><div class='cur-row-main'>"+dn(USERS[pesU].name)+"</div><div class='cur-row-sub'>"+golAvg[pesU].avg.toFixed(1)+" goles por partido en promedio</div></div>";
  } else h+="<div class='cur-empty'>Sin datos aun.</div>";
  h+="</div>";

  // ---- 5. EL MAS ATREVIDO (mayor diferencia de goles promedio) ----
  var boldAvg={};
  uids.forEach(function(u){
    var p=PREDS[u]||{},tot=0,n=0;
    am.forEach(function(m){var x=p[m.id];if(x){tot+=Math.abs((+x.home)-(+x.away));n++;}});
    if(n>0)boldAvg[u]=tot/n;
  });
  var boldU=null;
  Object.keys(boldAvg).forEach(function(u){if(boldU===null||boldAvg[u]>boldAvg[boldU])boldU=u;});
  h+="<div class='cur-card'><div class='cur-head'><span class='cur-emoji'>&#x1F3B2;</span><span class='cur-title'>El mas atrevido</span></div>";
  if(boldU!==null){
    h+="<div class='cur-big'>"+dn(USERS[boldU].name)+"</div><div class='cur-big-sub'>Marcadores con "+boldAvg[boldU].toFixed(1)+" goles de diferencia en promedio</div>";
  } else h+="<div class='cur-empty'>Sin datos aun.</div>";
  h+="</div>";

  // ---- 6. MARCADOR FAVORITO DE LA FAMILIA ----
  var scoreTally={};
  uids.forEach(function(u){
    var p=PREDS[u]||{};
    am.forEach(function(m){var x=p[m.id];if(x){var k=x.home+"-"+x.away;scoreTally[k]=(scoreTally[k]||0)+1;}});
  });
  var favKeys=Object.keys(scoreTally).sort(function(a,b){return scoreTally[b]-scoreTally[a];});
  h+="<div class='cur-card'><div class='cur-head'><span class='cur-emoji'>&#x2B50;</span><span class='cur-title'>Marcador favorito de la familia</span></div>";
  if(favKeys.length>0){
    h+="<div class='cur-fav-score'>"+favKeys[0].replace("-"," - ")+"</div><div class='cur-big-sub'>Pronosticado "+scoreTally[favKeys[0]]+" veces</div>";
  } else h+="<div class='cur-empty'>Sin datos aun.</div>";
  h+="</div>";

  // ---- 7. EL PARTIDO QUE DIVIDE A LA FAMILIA (mas marcadores distintos) ----
  var divMatch=null;
  am.forEach(function(m){
    var distinct={},count=0;
    uids.forEach(function(u){var p=(PREDS[u]||{})[m.id];if(p){count++;distinct[p.home+"-"+p.away]=1;}});
    var nd=Object.keys(distinct).length;
    if(count>=2){
      var variety=nd/count;
      if(!divMatch||nd>divMatch.nd||(nd===divMatch.nd&&variety>divMatch.variety))divMatch={m:m,nd:nd,count:count,variety:variety};
    }
  });
  h+="<div class='cur-card'><div class='cur-head'><span class='cur-emoji'>&#x1F92F;</span><span class='cur-title'>El partido que divide a la familia</span></div>";
  if(divMatch){
    h+="<div class='cur-match-name'>"+divMatch.m.h+" vs "+divMatch.m.a+"</div><div class='cur-big-sub'>"+divMatch.nd+" marcadores distintos entre "+divMatch.count+" pronosticos</div>";
  } else h+="<div class='cur-empty'>Sin datos aun.</div>";
  h+="</div>";

  // ---- 8. LA APUESTA MAS UNANIME (mismo ganador/empate) ----
  var unanMatch=null;
  am.forEach(function(m){
    var outc={home:0,draw:0,away:0},count=0;
    uids.forEach(function(u){var p=(PREDS[u]||{})[m.id];if(p){count++;if(+p.home>+p.away)outc.home++;else if(+p.home===+p.away)outc.draw++;else outc.away++;}});
    if(count>=2){
      var maxO=Math.max(outc.home,outc.draw,outc.away);
      var pct=maxO/count;
      if(!unanMatch||pct>unanMatch.pct||(pct===unanMatch.pct&&count>unanMatch.count)){
        var winOut=outc.home===maxO?"gana "+m.h:(outc.draw===maxO?"empate":"gana "+m.a);
        unanMatch={m:m,pct:pct,count:count,maxO:maxO,winOut:winOut};
      }
    }
  });
  h+="<div class='cur-card'><div class='cur-head'><span class='cur-emoji'>&#x1F91D;</span><span class='cur-title'>La apuesta mas unanime</span></div>";
  if(unanMatch){
    h+="<div class='cur-match-name'>"+unanMatch.m.h+" vs "+unanMatch.m.a+"</div><div class='cur-big-sub'>"+unanMatch.maxO+" de "+unanMatch.count+" pronosticaron: "+unanMatch.winOut+" ("+Math.round(unanMatch.pct*100)+"%)</div>";
  } else h+="<div class='cur-empty'>Sin datos aun.</div>";
  h+="</div>";

  g("curio-body").innerHTML=h;
  if(uids.length>=2)runCompare();
  runDeMomento();
}

window.runDeMomento=function(){
  var sel=g("dmCat");
  if(!sel)return;
  var cat=sel.value;
  var uids=Object.keys(USERS);
  // compute score breakdown per user
  var scores={};
  uids.forEach(function(u){
    var s=uScore(PREDS[u]||{},RESULTS);
    scores[u]=s[cat]||0;
  });
  var maxV=0;
  uids.forEach(function(u){if(scores[u]>maxV)maxV=scores[u];});
  var box=g("dmResult");
  if(maxV===0){box.innerHTML="<div class='cur-dm-empty'>Aun no hay aciertos en esta categoria.</div>";return;}
  var leaders=uids.filter(function(u){return scores[u]===maxV;});
  var catLabel={exact:"marcadores exactos",diff:"aciertos de diferencia",winner:"aciertos de resultado",one:"goles de un equipo"}[cat];
  var chips=leaders.map(function(u){return "<span class='cur-dm-chip'>"+dn(USERS[u].name)+"</span>";}).join("");
  box.innerHTML="<div class='cur-dm-val'>"+maxV+" <span class='cur-dm-val-lbl'>"+catLabel+"</span></div><div class='cur-dm-names'>"+chips+"</div>";
};
window.runCompare=function(){
  var aSel=g("cmpA"),bSel=g("cmpB");
  if(!aSel||!bSel)return;
  var ua=aSel.value,ub=bSel.value;
  var box=g("cmpResult");
  if(ua===ub){box.innerHTML="<div class='cur-cmp-msg'>Elige dos jugadores distintos.</div>";return;}
  var pa=PREDS[ua]||{},pb=PREDS[ub]||{};
  var same=0,sameWin=0,diff=0,common=0;
  GM.forEach(function(m){
    var x=pa[m.id],y=pb[m.id];
    if(x&&y){
      common++;
      if(+x.home===+y.home&&+x.away===+y.away)same++;
      else{
        var ox=Math.sign(+x.home-+x.away),oy=Math.sign(+y.home-+y.away);
        if(ox===oy)sameWin++;else diff++;
      }
    }
  });
  if(common===0){box.innerHTML="<div class='cur-cmp-msg'>No tienen partidos en comun aun.</div>";return;}
  var pct=Math.round(same/common*100);
  var html="<div class='cur-cmp-pct'>"+pct+"% sincronia</div>";
  html+="<div class='cur-cmp-bar'><div class='cur-cmp-fill' style='width:"+pct+"%'></div></div>";
  html+="<div class='cur-cmp-stats'>";
  html+="<div class='cur-cmp-stat'><span class='cur-cmp-num' style='color:var(--g)'>"+same+"</span><span class='cur-cmp-lbl'>iguales</span></div>";
  html+="<div class='cur-cmp-stat'><span class='cur-cmp-num' style='color:var(--gold)'>"+sameWin+"</span><span class='cur-cmp-lbl'>mismo ganador</span></div>";
  html+="<div class='cur-cmp-stat'><span class='cur-cmp-num' style='color:var(--red)'>"+diff+"</span><span class='cur-cmp-lbl'>distintos</span></div>";
  html+="</div>";
  box.innerHTML=html;
};

function rRules(){g("rules-body").innerHTML='<div class="adblock"><h3>Sistema de Puntuacion</h3><p style="color:var(--muted);font-size:14px;margin-bottom:16px">Solo se aplica el primer criterio cumplido, en orden A-B-C-D.</p><div class="rule-card" style="background:var(--gl);border-left:4px solid var(--g)"><div class="rule-pts" style="color:var(--g)">4</div><div class="rule-info"><div class="rule-title" style="color:var(--gd)">A - Marcador exacto</div><div class="rule-desc" style="color:var(--muted)">Acertaste el marcador exacto de ambos equipos.<br>Ej: pronosticaste 2-1 y el resultado fue 2-1.</div></div></div><div class="rule-card" style="background:var(--bluel);border-left:4px solid var(--blue)"><div class="rule-pts" style="color:var(--blue)">3</div><div class="rule-info"><div class="rule-title" style="color:var(--gd)">B - Diferencia de goles correcta</div><div class="rule-desc" style="color:var(--muted)">El ganador y la diferencia de goles son correctos. Solo aplica cuando hay un equipo ganador (no en empates).<br>Ej: pronosticaste 3-0, resultado fue 4-1.</div></div></div><div class="rule-card" style="background:var(--goldl);border-left:4px solid var(--gold)"><div class="rule-pts" style="color:var(--gold)">2</div><div class="rule-info"><div class="rule-title" style="color:var(--gd)">C - Resultado correcto</div><div class="rule-desc" style="color:var(--muted)">Acertaste quien gana, o que el partido termina en empate (aunque el marcador sea distinto).<br>Ej: pronosticaste 1-0, resultado fue 3-1. O pronosticaste 1-1, resultado fue 2-2.</div></div></div><div class="rule-card" style="background:#f8f7f4;border-left:4px solid var(--border)"><div class="rule-pts" style="color:var(--muted)">1</div><div class="rule-info"><div class="rule-title" style="color:var(--gd)">D - Goles de un equipo</div><div class="rule-desc" style="color:var(--muted)">Acertaste los goles de uno de los dos equipos.<br>Ej: pronosticaste 1-3, resultado fue 1-0.</div></div></div></div><div class="adblock"><h3>Desempate</h3><div style="display:flex;flex-direction:column;gap:8px"><div style="padding:10px 14px;background:var(--bg);border-radius:var(--rs)"><strong>1 -</strong> Mas marcadores exactos</div><div style="padding:10px 14px;background:var(--bg);border-radius:var(--rs)"><strong>2 -</strong> Mas aciertos de diferencia</div><div style="padding:10px 14px;background:var(--bg);border-radius:var(--rs)"><strong>3 -</strong> Mas aciertos de resultado</div><div style="padding:10px 14px;background:var(--bg);border-radius:var(--rs)"><strong>4 -</strong> Mas aciertos de goles de un equipo</div></div></div><div class="adblock"><h3>Privacidad</h3><div style="display:flex;flex-direction:column;gap:8px;font-size:14px"><div style="padding:10px 14px;background:var(--bg);border-radius:var(--rs)">Antes de iniciar, nadie puede ver los picks de otros.</div><div style="padding:10px 14px;background:var(--bg);border-radius:var(--rs)">Una vez cerrada la edicion, no se pueden cambiar los picks.</div><div style="padding:10px 14px;background:var(--bg);border-radius:var(--rs)">En eliminatorias, los picks se cierran 1 hora antes del partido.</div></div></div>';}

function rAdmin(){if(!CP||!CP.isAdmin)return;var st=ST?ST.status:"waiting";var stB=st==="waiting"?'<p style="color:var(--muted);font-size:14px;margin-bottom:11px">Estado: Registro abierto. Pronosticos privados.</p><div class="flex-row"><button class="btn bgold bsm" onclick="adminSt(&quot;open&quot;)">Iniciar y revelar pronosticos</button><button class="btn bred bsm" onclick="adminSt(&quot;closed&quot;)">Cerrar edicion sin revelar</button></div>':st==="closed"?'<p style="color:var(--muted);font-size:14px;margin-bottom:11px">Estado: Cerrada.</p><button class="btn bgold bsm" onclick="adminSt(&quot;open&quot;)">Revelar e iniciar</button>':'<p style="color:var(--g);font-weight:700;font-size:15px">Quiniela en curso</p>';var pRows=Object.keys(USERS).map(function(uid){var u=USERS[uid],f=Object.keys(PREDS[uid]||{}).length;var r='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;gap:8px"><span>'+u.name+(u.isAdmin?" (admin)":"")+'</span><div style="display:flex;align-items:center;gap:6px;flex-shrink:0"><span class="badge '+(f>=GM.length?"bgreen":"bgray")+'">'+f+"/"+GM.length+"</span>";if(!u.isAdmin){r+='<button data-uid="'+uid+'" data-name="'+u.name+'" onclick="askReset(this.dataset.uid,this.dataset.name)" style="background:var(--goldl);color:var(--gold);border:none;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer">Resetear</button>';r+='<button data-uid="'+uid+'" data-name="'+u.name+'" onclick="askDelUser(this.dataset.uid,this.dataset.name)" style="background:var(--redl);color:var(--red);border:none;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer">Eliminar</button>';}r+="</div></div>";return r;}).join("");var gRows="";

    var dkey="adm-"+d;
    var dOpen;
    if(OPEN_ADM_DAY.hasOwnProperty(dkey))dOpen=OPEN_ADM_DAY[dkey];
    else dOpen=isToday;
    var cards="";mtchs.forEach(function(m){cards+=admRow(m.id,m.h,m.a,m.d);});
    var bdg=done===mtchs.length?"bgreen":"bgray";
    gRows+="<div class='grp-block"+(isToday?" cal-day-block-today":"")+"' data-dkey='"+dkey+"'>";
    gRows+="<button class='grp-header' onclick='toggleAdmDay(this)'>";
    gRows+="<span style='font-size:15px'>"+fmtDateLong(d)+(isToday?" <span class='cal-hoy'>HOY</span>":"")+"</span>";
    gRows+="<span style='display:flex;align-items:center;gap:8px'>";
    gRows+="<span class='badge "+bdg+"' style='font-size:11px'>"+done+"/"+mtchs.length+"</span>";
    gRows+="<span class='grp-arrow'>"+(dOpen?"\u25BC":"\u25B6")+"</span>";
    gRows+="</span></button>";
    gRows+="<div class='grp-body' style='display:"+(dOpen?"block":"none")+"'>"+cards+"</div>";
    gRows+="</div>";
  });
  var kRows="";
  // Knockout matches by date too
  var dateMapK={};
  KOM.forEach(function(m){if(!dateMapK[m.d])dateMapK[m.d]=[];dateMapK[m.d].push(m);});
  var datesK=Object.keys(dateMapK).sort();
  datesK.forEach(function(d){
    var mtchs=dateMapK[d];
    var done=mtchs.filter(function(m){return RESULTS[m.id]!==undefined;}).length;
    var dkey="admk-"+d;
    var dOpen=OPEN_ADM_DAY[dkey]?true:false;
    var cards="";mtchs.forEach(function(m){cards+=admRow(m.id,m.h,m.a,m.d);});
    var bdg=done===mtchs.length?"bgreen":"bgray";
    kRows+="<div class='grp-block' data-dkey='"+dkey+"'>";
    kRows+="<button class='grp-header' onclick='toggleAdmDay(this)'>";
    kRows+="<span style='font-size:15px'>"+fmtDateLong(d)+"</span>";
    kRows+="<span style='display:flex;align-items:center;gap:8px'>";
    kRows+="<span class='badge "+bdg+"' style='font-size:11px'>"+done+"/"+mtchs.length+"</span>";
    kRows+="<span class='grp-arrow'>"+(dOpen?"\u25BC":"\u25B6")+"</span>";
    kRows+="</span></button>";
    kRows+="<div class='grp-body' style='display:"+(dOpen?"block":"none")+"'>"+cards+"</div>";
    kRows+="</div>";
  });
  g("admin-body").innerHTML='<div class="adblock"><h3>Estado</h3>'+stB+'</div><div class="adblock"><h3>Participantes ('+Object.keys(USERS).length+')</h3>'+pRows+'</div><div class="adblock"><h3>Resultados</h3>'+gRows+'</div><div class="adblock"><h3>Eliminatorias</h3><p style="color:var(--muted);font-size:13px;margin-bottom:14px">Agrega los partidos cuando se conozcan los clasificados.</p><div style="background:var(--bg);border-radius:var(--r);padding:15px;margin-bottom:14px"><div class="slabel">Nuevo partido</div><div class="new-match-grid" style="margin-top:8px"><div class="field" style="margin:0"><label>Fase</label><select id="nm-phase">'+KPH.map(function(p){return'<option value="'+p.id+'">'+p.lb+'</option>';}).join("")+'</select></div><div class="field" style="margin:0"><label>Fecha</label><input type="date" id="nm-date"></div><div class="field" style="margin:0"><label>Hora</label><input type="time" id="nm-time" value="18:00"></div><div class="field" style="margin:0"><label>Local</label><input type="text" id="nm-home" placeholder="Argentina"></div><div class="field" style="margin:0"><label>Visitante</label><input type="text" id="nm-away" placeholder="Brasil"></div></div><button class="btn bprimary bsm" style="margin-top:11px" onclick="addKO()">Agregar partido</button></div>'+(kRows||'<p style="color:var(--muted);font-size:14px">Sin partidos de eliminatorias aun.</p>')+'</div>';}
window.adminSt=async function(s){await db.ref("config/state").update({status:s,_s:SEC});toast(s==="open"?"Quiniela iniciada!":s==="closed"?"Edicion cerrada":"OK");};

window.addKO=async function(){var phase=g("nm-phase").value,date=g("nm-date").value,time=g("nm-time").value,home=g("nm-home").value.trim(),away=g("nm-away").value.trim();if(!date||!home||!away){toast("Completa todos los campos");return;}var id="ko_"+phase+"_"+Date.now();await db.ref("knockout_matches/"+id).set({phase:phase,d:date,t:time,h:home,a:away,createdAt:Date.now(),_s:SEC});toast("Partido agregado");g("nm-home").value="";g("nm-away").value="";};
window.askReset=function(uid,name){showModal({icon:"🔑",title:"Resetear contrasena?",sub:name,body:"Se asignara un codigo de 6 digitos que debes enviarle al participante.",buttons:[{id:"c",label:"Cancelar",cls:"bghost",fn:null},{id:"r",label:"Resetear",cls:"bgold",fn:function(){doReset(uid,name);}}]});};
window.askDelUser=function(uid,name){showModal({icon:"🗑️",title:"Eliminar participante?",sub:name,body:"Se borraran su cuenta y todos sus pronosticos. No se puede deshacer.",buttons:[{id:"c",label:"Cancelar",cls:"bghost",fn:null},{id:"d",label:"Eliminar",cls:"bred",fn:function(){doDelUser(uid);}}]});};
async function doReset(uid,name){var code=Math.floor(100000+Math.random()*900000).toString();var hash=await sha256(code);await db.ref("users/"+uid).update({passwordHash:hash,_s:SEC});showModal({icon:"✅",title:"Contrasena reseteada",sub:name,score:code,body:"Envia este codigo al participante por WhatsApp.",buttons:[{id:"ok",label:"Entendido",cls:"bprimary",fn:null}]});}
async function doDelUser(uid){await db.ref("users/"+uid).remove();await db.ref("predictions/"+uid).remove();toast("Participante eliminado");}
var NICKS={"Gabriel Garcia":"Gabriel","Gabriel Garc\u00eda":"Gabriel","Ivan Amir Karim":"Ivan","Iv\u00e1n Amir Karim":"Ivan","Marileny":"Ian","Daniel Garcia":"Daniel","Daniel Garc\u00eda":"Daniel","Vanessa Garcia":"Vane","Vanessa Garc\u00eda":"Vane"};
function dn(name){return NICKS[name]||name;}
function g(id){return document.getElementById(id);}
function ini2(n){return(n||"?").split(" ").map(function(w){return w[0];}).join("").toUpperCase().slice(0,2);}
function fmtD(s){if(!s)return"";return new Date(s+"T12:00:00").toLocaleDateString("es-CR",{day:"numeric",month:"short"});}
function showAlert(id,msg,cls){var el=g(id);el.textContent=msg;el.className="alert "+(cls||"aerror");el.style.display="block";}
function hide(id){var el=g(id);if(el)el.style.display="none";}
var toastT;
function toast(msg,dur){var t=g("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},dur||3000);}
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&g("auth").style.display!=="none")doLogin();});
checkSession();

</script>
