<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Quiniela Familiar · Mundial 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1b6e3f;--gm:#228b4e;--gl:#e6f4ec;--gd:#0e3d22;--gold:#c8922a;--goldl:#fdf3e0;--red:#c0392b;--redl:#fce8e6;--blue:#1a6fa8;--bluel:#e6f0f8;--bg:#f2f0eb;--card:#fff;--border:#dedad2;--text:#1a1a18;--muted:#6b6860;--sw:230px;--r:13px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;letter-spacing:.3px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s;white-space:nowrap;font-family:'Nunito',sans-serif}
.btn:active{transform:scale(.97)}
.bfull{width:100%;margin-bottom:8px}
.bprimary{background:var(--g);color:#fff}.bprimary:hover{background:var(--gm)}
.bsecondary{background:var(--card);color:var(--g);border:2px solid var(--g)}.bsecondary:hover{background:var(--gl)}
.bgold{background:var(--gold);color:#fff}.bgold:hover{opacity:.9}
.bred{background:var(--red);color:#fff}.bred:hover{opacity:.9}
.bghost{background:transparent;color:var(--muted);border:1.5px solid var(--border)}.bghost:hover{background:var(--bg)}
.bsm{padding:7px 13px;font-size:13px}
.biconbtn{background:none;border:none;cursor:pointer;padding:6px;border-radius:6px;display:flex;align-items:center;color:rgba(255,255,255,.65);transition:background .15s}
.biconbtn:hover{background:rgba(255,255,255,.15);color:#fff}

/* FORMS */
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.field input,.field select{width:100%;padding:12px 13px;border:2px solid var(--border);border-radius:var(--rs);font-size:15px;background:var(--bg);color:var(--text);transition:border-color .2s;-webkit-appearance:none;appearance:none;font-family:'Nunito',sans-serif}
.field input:focus,.field select:focus{outline:none;border-color:var(--g)}
.scorebox{width:54px;height:54px;border:2px solid var(--border);border-radius:var(--rs);font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;text-align:center;background:var(--bg);color:var(--text);transition:border-color .2s;-webkit-appearance:none;appearance:none}
.scorebox:focus{outline:none;border-color:var(--g);background:#fff}
.scorebox:disabled{opacity:.45;cursor:not-allowed;background:var(--border)}
.scorebox::-webkit-inner-spin-button,.scorebox::-webkit-outer-spin-button{-webkit-appearance:none}
.resbox{width:50px;height:50px;border:2px solid var(--border);border-radius:var(--rs);font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;text-align:center;background:var(--bg);color:var(--text);-webkit-appearance:none;appearance:none;font-family:'Nunito',sans-serif}
.resbox:focus{outline:none;border-color:var(--gold)}
.resbox::-webkit-inner-spin-button,.resbox::-webkit-outer-spin-button{-webkit-appearance:none}

/* ALERTS */
.alert{padding:10px 13px;border-radius:var(--rs);font-size:14px;margin-bottom:13px}
.aerror{background:var(--redl);color:#8b1a11}
.asuccess{background:var(--gl);color:var(--gd)}
.awarning{background:var(--goldl);color:#7a5510}
.ainfo{background:var(--bluel);color:#0f4a72}

/* AUTH */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--gd);position:relative;overflow:hidden}
#auth::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 40px,rgba(255,255,255,.015) 40px,rgba(255,255,255,.015) 41px)}
.auth-box{position:relative;z-index:1;width:100%;max-width:400px}
.auth-logo{text-align:center;margin-bottom:26px}
.auth-logo .ball{font-size:52px;display:block;margin-bottom:6px}
.auth-logo h1{font-family:'Barlow Condensed',sans-serif;font-size:50px;font-weight:800;color:#fff;line-height:1;letter-spacing:2px}
.auth-logo h1 span{color:#f5d67a}
.auth-logo p{color:rgba(255,255,255,.55);font-size:13px;margin-top:4px;letter-spacing:1px;text-transform:uppercase}
.auth-card{background:#fff;border-radius:var(--r);padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.auth-card h2{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:var(--gd);margin-bottom:18px}
.auth-switch{text-align:center;font-size:14px;color:var(--muted);margin-top:14px}
.auth-switch a{color:var(--g);font-weight:700;cursor:pointer}

/* APP LAYOUT */
#app{display:flex;min-height:100vh}

/* SIDEBAR PC */
#sidebar{width:var(--sw);background:var(--gd);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;overflow-y:auto}
.sb-logo{padding:18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo .icon{font-size:26px}
.sb-logo .title{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;color:#f5d67a;letter-spacing:1px;line-height:1}
.sb-logo .sub{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.5px}
.sb-nav{padding:12px 8px;flex:1;display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:10px;padding:10px 13px;background:none;border:none;color:rgba(255,255,255,.55);border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;text-align:left;transition:background .15s,color .15s;width:100%;font-family:'Nunito',sans-serif}
.ni svg{width:17px;height:17px;flex-shrink:0}
.ni:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
.ni.active{background:rgba(255,255,255,.15);color:#fff}
.ni.active svg{stroke:#f5d67a}
.sb-user{padding:13px 14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:9px}
.ava{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;flex-shrink:0}
.uname{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urole{font-size:11px;color:rgba(255,255,255,.45)}

/* MAIN */
#main{flex:1;margin-left:var(--sw)}
.page{display:none;padding:24px 26px 36px;max-width:840px}
.page.active{display:block}
.pheader{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--border)}
.ptitle{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:var(--gd);letter-spacing:.5px}
.mpill{display:none}

/* BOTTOM NAV mobile */
#bnav{display:none}

/* MOBILE */
@media(max-width:768px){
  #sidebar{display:none}
  #main{margin-left:0}
  .page{padding:14px 13px 120px;max-width:100%}
  .pheader{margin-bottom:14px;padding-bottom:10px}
  .ptitle{font-size:24px}
  .mpill{display:flex;align-items:center;gap:7px;margin-left:auto}
  .mpill .ava{width:28px;height:28px;font-size:12px}
  #bnav{display:flex;flex-wrap:wrap;position:fixed;bottom:0;left:0;right:0;background:var(--gd);border-top:1px solid rgba(255,255,255,.08);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
  .bni{flex:0 0 25%;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;background:none;border:none;color:rgba(255,255,255,.5);font-size:10px;font-weight:700;cursor:pointer;transition:color .15s;font-family:'Nunito',sans-serif}
  .bni svg{width:21px;height:21px}
  .bni.active{color:#f5d67a}
  .stats-grid{grid-template-columns:1fr 1fr 1fr}
  .new-match-grid{grid-template-columns:1fr}
}

/* MORE OVERLAY */


/* STATUS BANNER */
.sbanner{border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:18px}
.sbanner.sgreen{background:var(--g);color:#fff}
.sbanner.sgold{background:var(--gold);color:#fff}
.sbanner.sred{background:var(--red);color:#fff}
.sbanner.sblue{background:var(--blue);color:#fff}
.sbanner .sicon{font-size:30px;flex-shrink:0}
.sbanner h3{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700}
.sbanner p{font-size:13px;opacity:.85;margin-top:2px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.statcard{background:var(--card);border-radius:var(--r);padding:14px 12px;border:1px solid var(--border);text-align:center}
.statval{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:800;line-height:1}
.statlbl{font-size:11px;color:var(--muted);margin-top:3px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.scgreen .statval{color:var(--g)}
.scgold .statval{color:var(--gold)}
.scblue .statval{color:var(--blue)}

/* CARD */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.cp{padding:18px}
.mt8{margin-top:8px}.mt14{margin-top:14px}.mt18{margin-top:18px}

/* SECTION LABEL */
.slabel{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

/* PARTICIPANT */
.pcard{background:var(--card);border-radius:var(--r);padding:13px 15px;display:flex;align-items:center;gap:12px;margin-bottom:9px;border:1px solid var(--border)}
.pava{width:42px;height:42px;border-radius:50%;background:var(--gl);color:var(--gd);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;flex-shrink:0}
.pinfo{flex:1}
.pname{font-weight:700;font-size:15px}
.pstatus{font-size:12px;color:var(--muted);margin-top:2px}
.pbar{height:4px;background:var(--border);border-radius:2px;margin-top:6px}
.pbfill{height:100%;background:var(--g);border-radius:2px;transition:width .5s}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.bgreen{background:var(--gl);color:var(--gd)}
.bgray{background:#f0ede6;color:var(--muted)}

/* PHASE LABEL */
.plabel{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:16px 0 5px;border-bottom:1px solid var(--border);margin-bottom:12px}

/* MATCH CARD */
.mcard{background:var(--card);border-radius:var(--r);border:1px solid var(--border);margin-bottom:11px;overflow:hidden}
.mcard-head{display:flex;justify-content:space-between;align-items:center;padding:9px 15px 0}
.mphase{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.mdate{font-size:11px;color:var(--muted)}
.mcard-body{padding:10px 15px 13px}
.mteams{display:grid;grid-template-columns:1fr 74px 1fr;align-items:center;gap:6px;margin-bottom:11px}
.tname{font-weight:700;font-size:14px;line-height:1.2}
.tname.home{text-align:right}
.tname.away{text-align:left}
.mcenter{display:flex;flex-direction:column;align-items:center;gap:2px}
.vstext{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px}
.scoreinputs{display:flex;align-items:center;justify-content:center;gap:7px}
.scoresep{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--muted)}
.mcard-foot{border-top:1px solid var(--border);padding:7px 15px;display:flex;align-items:center;justify-content:space-between;background:#fafaf8}
.savedtag{font-size:12px;color:var(--g);font-weight:700}
.unsavedtag{font-size:12px;color:var(--muted)}
.lockedtag{font-size:12px;color:var(--red);font-weight:700}
.realthing{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--muted)}
.ptsbubble{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800}
.p4{background:var(--g);color:#fff}
.p3{background:var(--blue);color:#fff}
.p2{background:var(--gold);color:#fff}
.p1{background:#f0ede6;color:var(--muted)}
.p0{background:var(--redl);color:var(--red)}

/* LEADERBOARD */
.lbtable{display:flex;flex-direction:column;gap:7px}
.lbrow{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:13px 15px;display:flex;align-items:center;gap:11px}
.lbrow.isme{border:2px solid var(--g)}
.lbrow.r1{border-color:#c8922a;background:linear-gradient(135deg,#fff 0%,var(--goldl) 100%)}
.lbrow.r2{border-color:#9e9e9e}
.lbrow.r3{border-color:#a0714a}
.lbrank{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;min-width:32px;text-align:center;color:var(--muted)}
.lbrank.rk1{color:var(--gold);font-size:26px}
.lbrank.rk2{color:#888;font-size:24px}
.lbrank.rk3{color:#a0714a;font-size:24px}
.lbava{width:36px;height:36px;border-radius:50%;background:var(--gl);color:var(--gd);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;flex-shrink:0}
.lbinfo{flex:1;min-width:0}
.lbname{font-weight:700;font-size:15px}
.lbdetail{font-size:12px;color:var(--muted);margin-top:2px}
.lbpts{text-align:right}
.lbptsval{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:var(--gd);line-height:1}
.lbptslbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

/* ALL PICKS */
.upblock{background:var(--card);border-radius:var(--r);border:1px solid var(--border);margin-bottom:14px;overflow:hidden}
.uphead{padding:11px 15px;background:var(--gl);display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border)}
.uphead .name{font-weight:700;font-size:14px;color:var(--gd)}
.uptotal{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--g);margin-left:auto}
.pickrow{padding:8px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:13px}
.pickrow:last-child{border-bottom:none}
.pickmatch{color:var(--muted);flex:1}
.pickscore{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700}

/* WEEK TABS */
.wtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.wtab{padding:6px 13px;border-radius:20px;border:2px solid var(--border);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);transition:all .15s;font-family:'Nunito',sans-serif}
.wtab.active{background:var(--g);border-color:var(--g);color:#fff}

/* ADMIN */
.adblock{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:18px;margin-bottom:14px}
.adblock h3{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;color:var(--gd);margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--border)}
.admrow{padding:11px 0;border-bottom:1px solid var(--border)}
.admrow:last-child{border-bottom:none}
.admlabel{font-size:13px;font-weight:700;margin-bottom:7px;display:flex;justify-content:space-between}
.resinputs{display:flex;align-items:center;gap:7px}
.ressep{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--muted)}
.confirmed{font-size:13px;color:var(--muted);margin-top:5px}
.confirmed strong{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--gold)}
.new-match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.new-match-grid .field{margin:0}


/* COLLAPSIBLE GROUPS */
.grp-block{background:var(--card);border-radius:var(--r);border:1px solid var(--border);margin-bottom:11px;overflow:hidden}
.grp-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 15px;background:none;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--gd);letter-spacing:.5px;transition:background .15s}
.grp-header:hover{background:var(--gl)}
.grp-arrow{font-size:13px;color:var(--muted);transition:transform .2s}
.grp-body{display:none}

/* TOAST */
.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--gd);color:#fff;padding:9px 18px;border-radius:22px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:999;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:769px){.toast{bottom:22px}}

/* EMPTY */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .ei{font-size:50px;margin-bottom:10px}
.flex-row{display:flex;gap:8px;flex-wrap:wrap}
.divider{height:1px;background:var(--border);margin:14px 0}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth" style="display:none">
  <div class="auth-box">
    <div class="auth-logo">
      <span class="ball">⚽</span>
      <h1>MUNDIAL <span>2026</span></h1>
      <p>Quiniela Familiar</p>
    </div>
    <div id="vlogin" class="auth-card">
      <h2>Bienvenido</h2>
      <div class="alert aerror" id="lerr" style="display:none"></div>
      <div class="field"><label>Usuario</label><input type="text" id="luser" placeholder="tunombre" autocomplete="username" autocapitalize="none"></div>
      <div class="field"><label>Contraseña</label><input type="password" id="lpass" placeholder="••••••••"></div>
      <button class="btn bprimary bfull" onclick="doLogin()">Entrar</button>
      <p class="auth-switch">¿Primera vez? <a onclick="sv('register')">Crear cuenta</a></p>
    </div>
    <div id="vregister" class="auth-card" style="display:none">
      <h2>Crear cuenta</h2>
      <div class="alert aerror" id="rerr" style="display:none"></div>
      <div class="alert asuccess" id="rsuc" style="display:none"></div>
      <div class="field"><label>Tu nombre</label><input type="text" id="rname" placeholder="Ej: María García"></div>
      <div class="field"><label>Usuario</label><input type="text" id="ruser" placeholder="Ej: maria123" autocapitalize="none"></div>
      <div class="field"><label>Contraseña</label><input type="password" id="rpass" placeholder="Mínimo 6 caracteres"></div>
      <div class="field"><label>Confirmar contraseña</label><input type="password" id="rpass2" placeholder="Repetir contraseña"></div>
      <button class="btn bprimary bfull" onclick="doRegister()">Crear cuenta</button>
      <p class="auth-switch">¿Ya tienes cuenta? <a onclick="sv('login')">Iniciar sesión</a></p>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <aside id="sidebar">
    <div class="sb-logo"><span class="icon">⚽</span><div><div class="title">MUNDIAL 2026</div><div class="sub">Quiniela Familiar</div></div></div>
    <nav class="sb-nav">
      <button class="ni active" data-p="home" onclick="gp('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg><span>Inicio</span></button>
      <button class="ni" data-p="leaderboard" onclick="gp('leaderboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg><span>Ranking</span></button>

// ══════════════════════════════════════════════
// CRYPTO — SHA-256
// ══════════════════════════════════════════════
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ══════════════════════════════════════════════
// SCORING
// ══════════════════════════════════════════════
function pts(pred, res) {
  const ph=+pred.home, pa=+pred.away, rh=+res.home, ra=+res.away;
  if(ph===rh && pa===ra) return 4;
  if((ph-pa)===(rh-ra)) return 3;
  if(Math.sign(ph-pa)===Math.sign(rh-ra)) return 2;
  if(ph===rh || pa===ra) return 1;
  return 0;
}
function userScore(preds, results) {
  let total=0,exact=0,diff=0,winner=0,one=0;
  for(const [mid,res] of Object.entries(results)){
    const p=preds[mid]; if(!p) continue;
    const v=pts(p,res); total+=v;
    if(v===4)exact++; else if(v===3)diff++; else if(v===2)winner++; else if(v===1)one++;
  }
  return{total,exact,diff,winner,one};
}
function buildLB(preds, results, users) {
  return Object.entries(users).map(([uid,u])=>{
    const s=userScore(preds[uid]||{},results);
    return{uid,name:u.name,...s};
  }).sort((a,b)=>b.total!==a.total?b.total-a.total:b.exact!==a.exact?b.exact-a.exact:b.diff-a.diff);
}
function matchWeek(d,first){ return Math.floor((new Date(d)-new Date(first))/(7*864e5))+1; }
function matchOpen(d,t){ return new Date(d+'T'+t+':00')-new Date()>36e5; }

async function doLogin() {
  const user = g('luser').value.trim().toLowerCase();
  const pass = g('lpass').value;
  hide('lerr');
  if(!user||!pass) return showAlert('lerr','Completa todos los campos');
  const snap = await db.ref('users/'+user).get();
  if(!snap.exists()) return showAlert('lerr','Usuario no encontrado');
  const data = snap.val();
  const hash = await sha256(pass);
  if(data.passwordHash !== hash) return showAlert('lerr','Contraseña incorrecta');
  CU = user;
  CP = data;
  localStorage.setItem('qm26_session', user);
  startListeners();
  showApp();
}

async function doRegister() {
  const name = g('rname').value.trim();
  const user = g('ruser').value.trim().toLowerCase();
  const pass = g('rpass').value;
  const pass2 = g('rpass2').value;
  hide('rerr'); hide('rsuc');
  if(!name||!user||!pass||!pass2) return showAlert('rerr','Completa todos los campos');
  if(!/^[a-z0-9_]+$/.test(user)) return showAlert('rerr','Usuario: solo letras, números y guión bajo');
  if(pass.length<6) return showAlert('rerr','Contraseña mínimo 6 caracteres');
  if(pass!==pass2) return showAlert('rerr','Las contraseñas no coinciden');
  const snap = await db.ref('users/'+user).get();
  if(snap.exists()) return showAlert('rerr','Ese usuario ya existe');
  const usersSnap = await db.ref('users').get();
  const isFirst = !usersSnap.exists();
  const hash = await sha256(pass);
  await db.ref('users/'+user).set({name, passwordHash:hash, isAdmin:isFirst, createdAt:Date.now()});
  if(isFirst) await db.ref('config/state').set({status:'waiting'});
  showAlert('rsuc','✅ Cuenta creada. ¡Iniciando sesión!','asuccess');
  setTimeout(()=>{g('luser').value=user;g('lpass').value=pass;doLogin();},1200);
}

async function checkSession() {

  const snap = await db.ref('users/'+saved).get();
  if(!snap.exists()) { showAuthScreen(); return; }
  CU = saved;
  CP = snap.val();
  startListeners();
  showApp();
}

    KOM=Object.entries(v).map(([id,m])=>({id,...m})).sort((a,b)=>(a.d||'').localeCompare(b.d||''));

}

function renderMyPicks() {
  if(!ST) return;
  const myP=PREDS[CU]||{}, locked=ST.status!=='waiting';
  let html=locked
    ?`<div class="alert awarning">🔒 Edición cerrada. Ya no puedes cambiar tus pronósticos de grupos.</div>`
    :`<div class="alert ainfo">✏️ Se guardan automáticamente. Puedes editar hasta que el admin inicie la quiniela.</div>`;

  // Group matches by group letter
  const groups={};
  GM.forEach(m=>{ if(!groups[m.g])groups[m.g]=[]; groups[m.g].push(m); });
  Object.entries(groups).forEach(([grp,matches])=>{
    const filled=matches.filter(m=>myP[m.id]).length;
    const allFilled=filled===matches.length;
    const gid='grp-'+grp;
    html+='<div class="grp-block">'
      +'<button class="grp-header" onclick="toggleGrp(&quot;'+gid+'&quot;,event)">'
      +'<span>⚽ Grupo '+grp+'</span>'
      +'<span style="display:flex;align-items:center;gap:8px">'
      +'<span class="badge '+(allFilled?'bgreen':'bgray')+'" style="font-size:11px">'+filled+'/'+matches.length+'</span>'
      +'<span class="grp-arrow" id="arr-'+gid+'">▶</span>'
      +'</span></button>'
      +'<div class="grp-body" id="'+gid+'">'
      +matches.map(m=>mkCard(m,myP[m.id],locked,false)).join('')
      +'</div></div>';
  });

  if(KOM.length>0){
    const phases={};
    KOM.forEach(m=>{ if(!phases[m.phase])phases[m.phase]=[]; phases[m.phase].push(m); });
    Object.entries(phases).forEach(([phase,matches])=>{
      const ph=KPHASES.find(p=>p.id===phase);
      const filled=matches.filter(m=>myP[m.id]).length;
      const allFilled=filled===matches.length;
      const kid='grp-ko-'+phase;
      html+='<div class="grp-block">'
        +'<button class="grp-header" onclick="toggleGrp(&quot;'+kid+'&quot;,event)">'
        +'<span>🏆 '+(ph?.label||phase)+'</span>'
        +'<span style="display:flex;align-items:center;gap:8px">'
        +'<span class="badge '+(allFilled?'bgreen':'bgray')+'" style="font-size:11px">'+filled+'/'+matches.length+'</span>'
        +'<span class="grp-arrow" id="arr-'+kid+'">▶</span>'
        +'</span></button>'
        +'<div class="grp-body" id="'+kid+'">'
        +matches.map(m=>mkCard(m,myP[m.id],!matchOpen(m.d,m.t||'12:00'),true)).join('')
        +'</div></div>';
    });
  }
  g('mypicks-body').innerHTML=html;
}

function mkCard(m,pred,locked,isKO) {
  const hv=pred?.home!==undefined?pred.home:'', av=pred?.away!==undefined?pred.away:'';
  const res=RESULTS[m.id], pv=(res&&pred)?pts(pred,res):null;
  return `<div class="mcard">
    <div class="mcard-head"><span class="mphase">${isKO?(KPHASES.find(p=>p.id===m.phase)?.label||m.phase):'Grupo '+m.g}</span><span class="mdate">${fmtDate(m.d)} ${m.t||''}</span></div>
    <div class="mcard-body">
      <div class="mteams"><div class="tname home">${m.h}</div><div class="mcenter"><span class="vstext">VS</span></div><div class="tname away">${m.a}</div></div>
      <div class="scoreinputs">
        <input type="number" min="0" max="20" class="scorebox" id="h-${m.id}" value="${hv===''?'':hv}" placeholder="" ${locked?'disabled':''} oninput="savePick('${m.id}')">
        <span class="scoresep">-</span>
        <input type="number" min="0" max="20" class="scorebox" id="a-${m.id}" value="${av===''?'':av}" placeholder="" ${locked?'disabled':''} oninput="savePick('${m.id}')">
      </div>
    </div>
    <div class="mcard-foot">
      ${locked?`<span class="lockedtag">🔒 Cerrado</span>`:`<span id="sv-${m.id}" class="${hv!==''?'savedtag':'unsavedtag'}">${hv!==''?'✅ Guardado':'Sin ingresar'}</span>`}
      ${!locked && hv!==''?`<button onclick="deletePick('${m.id}')" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 6px;border-radius:4px;font-family:'Nunito',sans-serif" title="Borrar pick">🗑️ Borrar</button>`:''}
      ${res?`<span class="realthing">Real: ${m.h} ${res.home}–${res.away} ${m.a}</span>`:''}
      ${pv!==null?`<div class="ptsbubble p${pv}">${pv}</div>`:''}
    </div>
  </div>`;
}

const savePickTimers = {};
window.savePick = (mid) => {
  clearTimeout(savePickTimers[mid]);
  savePickTimers[mid] = setTimeout(async () => {
    const hEl=g('h-'+mid), aEl=g('a-'+mid);
    if(!hEl||!aEl) return;
    const h=hEl.value, a=aEl.value;
    // If both empty, delete the pick
    if(h==='' && a==='') {
      await db.ref(`predictions/${CU}/${mid}`).remove();
      const sv=g('sv-'+mid); if(sv){sv.textContent='Sin ingresar';sv.className='unsavedtag';}
      return;
    }
    if(h===''||a==='') return; // only one filled, wait
    // Pause listener to avoid re-render jump
    PICKING = true;
    await db.ref(`predictions/${CU}/${mid}`).set({home:+h,away:+a,at:Date.now()});
    setTimeout(()=>{ PICKING = false; }, 1500);
    const sv=g('sv-'+mid); if(sv){sv.textContent='✅ Guardado';sv.className='savedtag';}
  }, 600);
};

      <div class="uphead"><div class="lbava" style="width:30px;height:30px;font-size:13px">${initials(u.name)}</div><span class="name">${u.name}${u.isAdmin?' 👑':''}</span><span class="uptotal">${sc.total}pts</span></div>
      ${sectionsHtml}
    </div>`;
  });
  g('allpicks-body').innerHTML=html||`<div class="empty"><div class="ei">📋</div><p>Sin datos</p></div>`;
}

window.adminStatus = async s => {
  await db.ref('config/state').update({status:s}); toast(s==='open'?'🟢 ¡Quiniela iniciada!':s==='closed'?'🔒 Edición cerrada':'✅ Listo');
};
window.saveRes = async mid => {
  const h=g('rh-'+mid)?.value, a=g('ra-'+mid)?.value;
  if(h===''||a==='') return;
  await db.ref('config/results/'+mid).set({home:+h,away:+a});
  toast('✅ Resultado guardado');
};
window.addKO = async () => {
  const phase=g('nm-phase').value,date=g('nm-date').value,time=g('nm-time').value,home=g('nm-home').value.trim(),away=g('nm-away').value.trim();
  if(!date||!home||!away) return toast('⚠️ Completa todos los campos');
  const id='ko_'+phase+'_'+Date.now();
  await db.ref('knockout_matches/'+id).set({phase,d:date,t:time,h:home,a:away,createdAt:Date.now()});
  toast('✅ Partido agregado'); g('nm-home').value=''; g('nm-away').value='';
};

window.resetPassword = async (uid, name) => {
  // Confirmacion
  const confirmed = confirm(`¿Resetear la contraseña de ${name}?\n\nSe asignará un código temporal de 6 dígitos que deberás enviarle por WhatsApp.`);
  if(!confirmed) return;

  // Generate random 6-digit code
  const code = Math.floor(100000 + Math.random() * 900000).toString();
  const hash = await sha256(code);

  await db.ref('users/' + uid + '/passwordHash').set(hash);

  // Show the code clearly
  alert(`✅ Contraseña de ${name} reseteada exitosamente.\n\nNueva contraseña temporal:\n\n🔑 ${code}\n\nEnvíasela por WhatsApp para que pueda entrar.`);
};

function g(id){return document.getElementById(id)}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function fmtDate(s){if(!s)return'';return new Date(s+'T12:00:00').toLocaleDateString('es-CR',{day:'numeric',month:'short'})}
function showAlert(id,msg,cls='aerror'){const el=g(id);el.textContent=msg;el.className='alert '+cls;el.style.display='block'}
function hide(id){const el=g(id);if(el)el.style.display='none'}
let toastT;
function toast(msg,dur=3000){const t=g('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),dur)}



window.deletePick = async (mid) => {
  const confirmed = confirm('¿Borrar este pronóstico?');
  if(!confirmed) return;
  PICKING = true;
  await db.ref(`predictions/${CU}/${mid}`).remove();
  // Update local state
  if(PREDS[CU]) delete PREDS[CU][mid];
  setTimeout(()=>{ PICKING = false; }, 500);
  // Update UI without full re-render
  const hEl=g('h-'+mid), aEl=g('a-'+mid), sv=g('sv-'+mid);
  if(hEl) hEl.value='';
  if(aEl) aEl.value='';
  if(sv){sv.textContent='Sin ingresar';sv.className='unsavedtag';}
  // Re-render just this card's footer by re-rendering the page
  PICKING = false;
  renderMyPicks();
};

window.toggleGrp = (id, event) => {
  if(event) event.stopPropagation();
  const body = document.getElementById(id);
  const arr = document.getElementById('arr-'+id);
  if(!body) return;
  const isHidden = body.style.display === 'none' || body.style.display === '';
  body.style.display = isHidden ? 'block' : 'none';
  if(arr) arr.textContent = isHidden ? '▼' : '▶';
};
