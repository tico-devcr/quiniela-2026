<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Quiniela Familiar · Mundial 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1b6e3f;--gm:#228b4e;--gl:#e6f4ec;--gd:#0e3d22;--gold:#c8922a;--goldl:#fdf3e0;--red:#c0392b;--redl:#fce8e6;--blue:#1a6fa8;--bluel:#e6f0f8;--bg:#f2f0eb;--card:#fff;--border:#dedad2;--text:#1a1a18;--muted:#6b6860;--sw:230px;--r:13px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;letter-spacing:.3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s;white-space:nowrap;font-family:'Nunito',sans-serif}
.btn:active{transform:scale(.97)}
.bfull{width:100%;margin-bottom:8px}
.bprimary{background:var(--g);color:#fff}.bsecondary{background:var(--card);color:var(--g);border:2px solid var(--g)}
.bgold{background:var(--gold);color:#fff}.bred{background:var(--red);color:#fff}
.bghost{background:transparent;color:var(--muted);border:1.5px solid var(--border)}
.bsm{padding:7px 13px;font-size:13px}
.biconbtn{background:none;border:none;cursor:pointer;padding:6px;border-radius:6px;display:flex;align-items:center;color:rgba(255,255,255,.65)}
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.field input,.field select{width:100%;padding:12px 13px;border:2px solid var(--border);border-radius:var(--rs);font-size:15px;background:var(--bg);color:var(--text);-webkit-appearance:none;font-family:'Nunito',sans-serif}
.field input:focus,.field select:focus{outline:none;border-color:var(--g)}
.scorebox{width:54px;height:54px;border:2px solid var(--border);border-radius:var(--rs);font-size:28px;font-weight:800;text-align:center;background:var(--bg);color:var(--text);-webkit-appearance:none;font-family:'Barlow Condensed',sans-serif}
.scorebox:focus{outline:none;border-color:var(--g);background:#fff}
.scorebox:disabled{opacity:.45;cursor:not-allowed;background:var(--border)}
.scorebox::-webkit-inner-spin-button,.scorebox::-webkit-outer-spin-button{-webkit-appearance:none}
.resbox{width:50px;height:50px;border:2px solid var(--border);border-radius:var(--rs);font-size:22px;font-weight:800;text-align:center;background:var(--bg);color:var(--text);-webkit-appearance:none;font-family:'Barlow Condensed',sans-serif}
.resbox:focus{outline:none;border-color:var(--gold)}
.resbox::-webkit-inner-spin-button,.resbox::-webkit-outer-spin-button{-webkit-appearance:none}
.alert{padding:10px 13px;border-radius:var(--rs);font-size:14px;margin-bottom:13px}
.aerror{background:var(--redl);color:#8b1a11}.asuccess{background:var(--gl);color:var(--gd)}
.awarning{background:var(--goldl);color:#7a5510}.ainfo{background:var(--bluel);color:#0f4a72}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--gd)}
.auth-box{width:100%;max-width:400px}
.auth-logo{text-align:center;margin-bottom:26px}
.auth-logo .ball{font-size:52px;display:block;margin-bottom:6px}
.auth-logo h1{font-size:50px;font-weight:800;color:#fff;line-height:1;letter-spacing:2px}
.auth-logo h1 span{color:#f5d67a}
.auth-logo p{color:rgba(255,255,255,.55);font-size:13px;margin-top:4px;letter-spacing:1px;text-transform:uppercase}
.auth-card{background:#fff;border-radius:var(--r);padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.auth-card h2{font-size:24px;font-weight:700;color:var(--gd);margin-bottom:18px}
.auth-switch{text-align:center;font-size:14px;color:var(--muted);margin-top:14px}
.auth-switch a{color:var(--g);font-weight:700;cursor:pointer}
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sw);background:var(--gd);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;overflow-y:auto}
.sb-logo{padding:18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo .icon{font-size:26px}
.sb-logo .title{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;color:#f5d67a;letter-spacing:1px;line-height:1}
.sb-logo .sub{font-size:11px;color:rgba(255,255,255,.45)}
.sb-nav{padding:12px 8px;flex:1;display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:10px;padding:10px 13px;background:none;border:none;color:rgba(255,255,255,.55);border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;text-align:left;width:100%;font-family:'Nunito',sans-serif;transition:background .15s,color .15s}
.ni svg{width:17px;height:17px;flex-shrink:0}
.ni:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
.ni.active{background:rgba(255,255,255,.15);color:#fff}
.ni.active svg{stroke:#f5d67a}
.sb-user{padding:13px 14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:9px}
.ava{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;flex-shrink:0}
.uname{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urole{font-size:11px;color:rgba(255,255,255,.45)}
#main{flex:1;margin-left:var(--sw)}
.page{display:none;padding:24px 26px 36px;max-width:840px}
.page.active{display:block}
.pheader{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--border)}
.ptitle{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:var(--gd);letter-spacing:.5px}
.mpill{display:none}
#bnav{display:none}
@media(max-width:768px){
  #sidebar{display:none}
  #main{margin-left:0}
  .page{padding:14px 13px 130px;max-width:100%}
  .pheader{margin-bottom:14px;padding-bottom:10px}
  .ptitle{font-size:24px}
  .mpill{display:flex;align-items:center;gap:7px}
  #bnav{display:flex;flex-wrap:wrap;position:fixed;bottom:0;left:0;right:0;background:var(--gd);border-top:1px solid rgba(255,255,255,.08);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
  .bni{flex:0 0 25%;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;background:none;border:none;color:rgba(255,255,255,.5);font-size:10px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif}
  .bni svg{width:20px;height:20px}
  .bni.active{color:#f5d67a}
  .bni-admin{display:none}
}
.sbanner{border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:18px}
.sbanner.sgreen{background:var(--g);color:#fff}.sbanner.sgold{background:var(--gold);color:#fff}
.sbanner.sred{background:var(--red);color:#fff}.sbanner.sblue{background:var(--blue);color:#fff}
.sbanner .sicon{font-size:30px;flex-shrink:0}
.sbanner h3{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700}
.sbanner p{font-size:13px;opacity:.85;margin-top:2px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.statcard{background:var(--card);border-radius:var(--r);padding:14px 12px;border:1px solid var(--border);text-align:center}
.statcard.clickable{cursor:pointer}.statcard.clickable:hover{border-color:var(--g)}
.statval{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:800;line-height:1}
.statlbl{font-size:11px;color:var(--muted);margin-top:3px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.scgreen .statval{color:var(--g)}.scgold .statval{color:var(--gold)}.scblue .statval{color:var(--blue)}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--border)}.cp{padding:18px}
.mt8{margin-top:8px}.mt14{margin-top:14px}
.slabel{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.pcard{background:var(--card);border-radius:var(--r);padding:13px 15px;display:flex;align-items:center;gap:12px;margin-bottom:9px;border:1px solid var(--border)}
.pava{width:42px;height:42px;border-radius:50%;background:var(--gl);color:var(--gd);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;flex-shrink:0}
.pinfo{flex:1}.pname{font-weight:700;font-size:15px}.pstatus{font-size:12px;color:var(--muted);margin-top:2px}
.pbar{height:4px;background:var(--border);border-radius:2px;margin-top:6px}
.pbfill{height:100%;background:var(--g);border-radius:2px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.bgreen{background:var(--gl);color:var(--gd)}.bgray{background:#f0ede6;color:var(--muted)}
.plabel{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:16px 0 5px;border-bottom:1px solid var(--border);margin-bottom:12px}
.mcard{background:var(--card);border-radius:var(--r);border:1px solid var(--border);margin-bottom:11px;overflow:hidden}
.mcard-head{display:flex;justify-content:space-between;align-items:center;padding:9px 15px 0}
.mphase{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.mdate{font-size:11px;color:var(--muted)}
.mcard-body{padding:10px 15px 13px}
.mteams{display:grid;grid-template-columns:1fr 74px 1fr;align-items:center;gap:6px;margin-bottom:11px}
.tname{font-weight:700;font-size:14px;line-height:1.2}
.tname.home{text-align:right}.tname.away{text-align:left}
.mcenter{display:flex;flex-direction:column;align-items:center;gap:2px}
.vstext{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px}
.scoreinputs{display:flex;align-items:center;justify-content:center;gap:7px}
.scoresep{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--muted)}
.mcard-foot{border-top:1px solid var(--border);padding:7px 15px;display:flex;align-items:center;justify-content:space-between;background:#fafaf8;gap:8px;flex-wrap:wrap}
.savedtag{font-size:12px;color:var(--g);font-weight:700}
.unsavedtag{font-size:12px;color:var(--muted)}
.lockedtag{font-size:12px;color:var(--red);font-weight:700}
.realthing{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--muted)}
.ptsbubble{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800}
.p4{background:var(--g);color:#fff}.p3{background:var(--blue);color:#fff}
.p2{background:var(--gold);color:#fff}.p1{background:#f0ede6;color:var(--muted)}.p0{background:var(--redl);color:var(--red)}
.score-display{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:44px;font-weight:800;color:var(--gd);letter-spacing:4px;padding:6px 0}
.lbtable{display:flex;flex-direction:column;gap:7px}
.lbrow{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:13px 15px;display:flex;align-items:center;gap:11px}
.lbrow.isme{border:2px solid var(--g)}.lbrow.r1{border-color:#c8922a;background:linear-gradient(135deg,#fff 0%,var(--goldl) 100%)}
.lbrow.r2{border-color:#9e9e9e}.lbrow.r3{border-color:#a0714a}
.lbrank{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;min-width:32px;text-align:center;color:var(--muted)}
.lbrank.rk1{color:var(--gold);font-size:26px}.lbrank.rk2{color:#888;font-size:24px}.lbrank.rk3{color:#a0714a;font-size:24px}
.lbava{width:36px;height:36px;border-radius:50%;background:var(--gl);color:var(--gd);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;flex-shrink:0}
.lbinfo{flex:1;min-width:0}.lbname{font-weight:700;font-size:15px}.lbdetail{font-size:12px;color:var(--muted);margin-top:2px}
.lbpts{text-align:right}.lbptsval{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:var(--gd);line-height:1}
.lbptslbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.upblock{background:var(--card);border-radius:var(--r);border:1px solid var(--border);margin-bottom:14px;overflow:hidden}
.uphead{padding:11px 15px;background:var(--gl);display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border)}
.uphead .uname2{font-weight:700;font-size:14px;color:var(--gd)}
.uptotal{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--g);margin-left:auto}
.pickrow{padding:8px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:13px}
.pickrow:last-child{border-bottom:none}
.pickmatch{color:var(--muted);flex:1}
.pickscore{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700}
.wtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.wtab{padding:6px 13px;border-radius:20px;border:2px solid var(--border);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);font-family:'Nunito',sans-serif}
.wtab.active{background:var(--g);border-color:var(--g);color:#fff}
.adblock{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:18px;margin-bottom:14px}
.adblock h3{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;color:var(--gd);margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--border)}
.admrow{padding:11px 0;border-bottom:1px solid var(--border)}.admrow:last-child{border-bottom:none}
.admlabel{font-size:13px;font-weight:700;margin-bottom:7px;display:flex;justify-content:space-between}
.resinputs{display:flex;align-items:center;gap:7px}
.ressep{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--muted)}
.confirmed{font-size:13px;color:var(--muted);margin-top:5px}
.confirmed strong{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--gold)}
.new-match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.new-match-grid .field{margin:0}
@media(max-width:480px){.new-match-grid{grid-template-columns:1fr}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:#fff;border-radius:var(--r);padding:24px 22px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:slideUp .2s}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-icon{font-size:40px;text-align:center;margin-bottom:8px}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:var(--gd);text-align:center;margin-bottom:6px}
.modal-score{font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:800;color:var(--g);text-align:center;margin:8px 0;letter-spacing:3px}
.modal-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:4px}
.modal-body{font-size:14px;color:var(--muted);text-align:center;margin-bottom:4px}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns .btn{flex:1}
.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--gd);color:#fff;padding:9px 18px;border-radius:22px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:769px){.toast{bottom:22px}}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}.empty .ei{font-size:50px;margin-bottom:10px}
.flex-row{display:flex;gap:8px;flex-wrap:wrap}
.rule-card{border-radius:var(--rs);padding:14px;display:flex;align-items:flex-start;gap:14px;margin-bottom:10px}
.rule-pts{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;min-width:36px;text-align:center;line-height:1}
.rule-info .rule-title{font-weight:700;font-size:15px;margin-bottom:4px}
.rule-info .rule-desc{font-size:13px;line-height:1.5}
</style>
</head>
<body>
<!-- AUTH -->
<div id="auth" style="display:none">
  <div class="auth-box">
    <div class="auth-logo">
      <span class="ball">⚽</span>
      <h1>MUNDIAL <span>2026</span></h1>
      <p>Quiniela Familiar</p>
    </div>
    <div id="vlogin" class="auth-card">
      <h2>Bienvenido</h2>
      <div class="alert aerror" id="lerr" style="display:none"></div>
      <div class="field"><label>Usuario</label><input type="text" id="luser" placeholder="tunombre" autocomplete="username" autocapitalize="none"></div>
      <div class="field"><label>Contraseña</label><input type="password" id="lpass" placeholder="••••••••"></div>
      <button class="btn bprimary bfull" onclick="doLogin()">Entrar</button>
      <p class="auth-switch">¿Primera vez? <a onclick="sv('register')">Crear cuenta</a></p>
    </div>
    <div id="vregister" class="auth-card" style="display:none">
      <h2>Crear cuenta</h2>
      <div class="alert aerror" id="rerr" style="display:none"></div>
      <div class="alert asuccess" id="rsuc" style="display:none"></div>
      <div class="field"><label>Tu nombre</label><input type="text" id="rname" placeholder="Ej: María García"></div>
      <div class="field"><label>Usuario</label><input type="text" id="ruser" placeholder="Ej: maria123" autocapitalize="none"></div>
      <div class="field"><label>Contraseña</label><input type="password" id="rpass" placeholder="Mínimo 6 caracteres"></div>
      <div class="field"><label>Confirmar contraseña</label><input type="password" id="rpass2" placeholder="Repetir contraseña"></div>
      <button class="btn bprimary bfull" onclick="doRegister()">Crear cuenta</button>
      <p class="auth-switch">¿Ya tienes cuenta? <a onclick="sv('login')">Iniciar sesión</a></p>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <aside id="sidebar">
    <div class="sb-logo"><span class="icon">⚽</span><div><div class="title">MUNDIAL 2026</div><div class="sub">Quiniela Familiar</div></div></div>
    <nav class="sb-nav">
      <button class="ni active" data-p="home" onclick="gp('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg><span>Inicio</span></button>
      <button class="ni" data-p="leaderboard" onclick="gp('leaderboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg><span>Ranking</span></button>
      <button class="ni" data-p="mypicks" onclick="gp('mypicks')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg><span>Mis Picks</span></button>

="display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg);border-radius:var(--rs)"><span style="font-family:Barlow Condensed,sans-serif;font-size:20px;font-weight:800;color:var(--g);min-width:24px">1°</span><span style="font-size:14px">Más marcadores <strong>exactos</strong></span></div><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg);border-radius:var(--rs)"><span style="font-family:Barlow Condensed,sans-serif;font-size:20px;font-weight:800;color:var(--blue);min-width:24px">2°</span><span style="font-size:14px">Más aciertos de <strong>diferencia</strong></span></div><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg);border-radius:var(--rs)"><span style="font-family:Barlow Condensed,sans-serif;font-size:20px;font-weight:800;color:var(--gold);min-width:24px">3°</span><span style="font-size:14px">Más aciertos de <strong>resultado</strong></span></div></div></div><div class="adblock"><h3>🔒 Privacidad</h3><div style="display:flex;flex-direction:column;gap:8px;font-size:14px"><div style="padding:10px 14px;background:var(--bg);border-radius:var(--rs)">Antes de que el admin inicie, <strong>nadie puede ver los picks de otros</strong>.</div><div style="padding:10px 14px;background:var(--bg);border-radius:var(--rs)">Una vez cerrada la edición, <strong>no se pueden cambiar los picks</strong>.</div><div style="padding:10px 14px;background:var(--bg);border-radius:var(--rs)">En eliminatorias, los picks se cierran <strong>1 hora antes</strong> del partido.</div></div></div>';}
function renderAdmin(){if(!CP||!CP.isAdmin)return;var st=ST?ST.status:"waiting";var stB=st==="waiting"?'<p style="color:var(--muted);font-size:14px;margin-bottom:11px">Estado: <strong>Registro abierto</strong>. Pronósticos privados.</p><div class="flex-row"><button class="btn bgold bsm" onclick="adminStatus(\'open\')">🟢 Iniciar y revelar pronósticos</button><button class="btn bred bsm" onclick="adminStatus(\'closed\')">🔒 Cerrar edición sin revelar</button></div>':st==="closed"?'<p style="color:var(--muted);font-size:14px;margin-bottom:11px">Estado: <strong>Cerrada</strong>.</p><button class="btn bgold bsm" onclick="adminStatus(\'open\')">🟢 Revelar e iniciar</button>':'<p style="color:var(--g);font-weight:700;font-size:15px">✅ Quiniela en curso</p>';var pRows=Object.keys(USERS).map(function(uid){var u=USERS[uid],f=Object.keys(PREDS[uid]||{}).length;var r='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;gap:8px"><span>'+u.name+(u.isAdmin?" 👑":"")+'</span><div style="display:flex;align-items:center;gap:6px;flex-shrink:0"><span class="badge '+(f>=GM.length?"bgreen":"bgray")+'">'+f+"/"+GM.length+"</span>";if(!u.isAdmin){r+='<button onclick="askResetPwd(\''+uid+'\',\''+u.name+'\')" style="background:var(--goldl);color:var(--gold);border:none;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer">🔑 Resetear</button>';r+='<button onclick="askDeleteUser(\''+uid+'\',\''+u.name+'\')" style="background:var(--redl);color:var(--red);border:none;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer">🗑️ Eliminar</button>';}r+="</div></div>";return r;}).join("");var gRows="",lg="";GM.forEach(function(m){if(m.g!==lg){gRows+='<div class="plabel" style="margin-top:10px">Grupo '+m.g+"</div>";lg=m.g;}var res=RESULTS[m.id];gRows+='<div class="admrow"><div class="admlabel"><span>'+m.h+" vs "+m.a+'</span><span style="color:var(--muted);font-size:11px">'+fmtDate(m.d)+"</span></div><div class=\"resinputs\"><input type=\"number\" min=\"0\" max=\"20\" class=\"resbox\" id=\"rh-"+m.id+"\" value=\""+(res?res.home:"")+"\" placeholder=\"0\" oninput=\"saveRes('"+m.id+"')\"><span class=\"ressep\">-</span><input type=\"number\" min=\"0\" max=\"20\" class=\"resbox\" id=\"ra-"+m.id+"\" value=\""+(res?res.away:"")+"\" placeholder=\"0\" oninput=\"saveRes('"+m.id+"')\"></div>"+(res?'<div class="confirmed">✅ <strong>'+m.h+" "+res.home+"-"+res.away+" "+m.a+"</strong></div>":"")+"</div>";});var kRows="",lp="";KOM.forEach(function(m){if(m.phase!==lp){var ph=KPHASES.find(function(p){return p.id===m.phase;});kRows+='<div class="plabel" style="margin-top:10px">'+(ph?ph.label:m.phase)+"</div>";lp=m.phase;}var res=RESULTS[m.id];kRows+='<div class="admrow"><div class="admlabel"><span>'+m.h+" vs "+m.a+'</span><span style="color:var(--muted);font-size:11px">'+fmtDate(m.d)+"</span></div><div class=\"resinputs\"><input type=\"number\" min=\"0\" max=\"20\" class=\"resbox\" id=\"rh-"+m.id+"\" value=\""+(res?res.home:"")+"\" placeholder=\"0\" oninput=\"saveRes('"+m.id+"')\"><span class=\"ressep\">-</span><input type=\"number\" min=\"0\" max=\"20\" class=\"resbox\" id=\"ra-"+m.id+"\" value=\""+(res?res.away:"")+"\" placeholder=\"0\" oninput=\"saveRes('"+m.id+"')\"></div>"+(res?'<div class="confirmed">✅ <strong>'+m.h+" "+res.home+"-"+res.away+" "+m.a+"</strong></div>":"")+"</div>";});g("admin-body").innerHTML='<div class="adblock"><h3>⚙️ Estado</h3>'+stB+'</div><div class="adblock"><h3>👥 Participantes ('+Object.keys(USERS).length+')</h3>'+pRows+'</div><div class="adblock"><h3>⚽ Resultados · Grupos</h3>'+gRows+'</div><div class="adblock"><h3>🏆 Eliminatorias</h3><p style="color:var(--muted);font-size:13px;margin-bottom:14px">Agrega los partidos cuando se conozcan los clasificados.</p><div style="background:var(--bg);border-radius:var(--r);padding:15px;margin-bottom:14px"><div class="slabel">Nuevo partido</div><div class="new-match-grid" style="margin-top:8px"><div class="field" style="margin:0"><label>Fase</label><select id="nm-phase">'+KPHASES.map(function(p){return'<option value="'+p.id+'">'+p.label+'</option>';}).join("")+'</select></div><div class="field" style="margin:0"><label>Fecha</label><input type="date" id="nm-date"></div><div class="field" style="margin:0"><label>Hora</label><input type="time" id="nm-time" value="18:00"></div><div class="field" style="margin:0"><label>Local</label><input type="text" id="nm-home" placeholder="Ej: Argentina"></div><div class="field" style="margin:0"><label>Visitante</label><input type="text" id="nm-away" placeholder="Ej: Brasil"></div></div><button class="btn bprimary bsm" style="margin-top:11px" onclick="addKO()">+ Agregar partido</button></div>'+(kRows||'<p style="color:var(--muted);font-size:14px">Sin partidos de eliminatorias aún.</p>')+'</div>';}
window.adminStatus=async function(s){await db.ref("config/state").update({status:s,_s:APP_SECRET});toast(s==="open"?"🟢 ¡Quiniela iniciada!":s==="closed"?"🔒 Edición cerrada":"✅ Listo");};
window.saveRes=async function(mid){var h=g("rh-"+mid)?g("rh-"+mid).value:"",a=g("ra-"+mid)?g("ra-"+mid).value:"";if(h===""||a==="")return;await db.ref("config/results/"+mid).set({home:+h,away:+a,_s:APP_SECRET});toast("✅ Resultado guardado");};
window.addKO=async function(){var phase=g("nm-phase").value,date=g("nm-date").value,time=g("nm-time").value,home=g("nm-home").value.trim(),away=g("nm-away").value.trim();if(!date||!home||!away){toast("⚠️ Completa todos los campos");return;}var id="ko_"+phase+"_"+Date.now();await db.ref("knockout_matches/"+id).set({phase:phase,d:date,t:time,h:home,a:away,createdAt:Date.now(),_s:APP_SECRET});toast("✅ Partido agregado");g("nm-home").value="";g("nm-away").value="";};
window.askResetPwd=function(uid,name){showModal({icon:"🔑",title:"¿Resetear contraseña?",sub:name,body:"Se asignará un código de 6 dígitos que deberás enviarle al participante.",buttons:[{id:"c",label:"Cancelar",cls:"bghost",fn:null},{id:"r",label:"🔑 Resetear",cls:"bgold",fn:function(){doResetPwd(uid,name);}}]});};
window.askDeleteUser=function(uid,name){showModal({icon:"⚠️",title:"¿Eliminar participante?",sub:name,body:"Se borrarán su cuenta y todos sus pronósticos. No se puede deshacer.",buttons:[{id:"c",label:"Cancelar",cls:"bghost",fn:null},{id:"d",label:"🗑️ Eliminar",cls:"bred",fn:function(){doDeleteUser(uid);}}]});};
async function doResetPwd(uid,name){var code=Math.floor(100000+Math.random()*900000).toString();var hash=await sha256(code);await db.ref("users/"+uid).update({passwordHash:hash,_s:APP_SECRET});showModal({icon:"✅",title:"Contraseña reseteada",sub:name,score:code,body:"Envía este código al participante por WhatsApp.",buttons:[{id:"ok",label:"Entendido",cls:"bprimary",fn:null}]});}
async function doDeleteUser(uid){await db.ref("users/"+uid).remove();await db.ref("predictions/"+uid).remove();toast("🗑️ Participante eliminado");}
function g(id){return document.getElementById(id);}
function initials(n){return(n||"?").split(" ").map(function(w){return w[0];}).join("").toUpperCase().slice(0,2);}
function fmtDate(s){if(!s)return"";return new Date(s+"T12:00:00").toLocaleDateString("es-CR",{day:"numeric",month:"short"});}
function showAlert(id,msg,cls){var el=g(id);el.textContent=msg;el.className="alert "+(cls||"aerror");el.style.display="block";}
function hide(id){var el=g(id);if(el)el.style.display="none";}
var toastT;
function toast(msg,dur){var t=g("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},dur||3000);}
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&g("auth").style.display!=="none")doLogin();});
checkSession();
</script>
